[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superpolyrio-paper-trading"
version = "0.1.0"
description = "Polymarket paper execution, accounting, risk, and fidelity services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-socks>=0.8",
    "duckdb>=1.2",
    "eth-abi>=5.1",
    "eth-account>=0.13",
    "eth-utils>=5.0",
    "Flask>=3.0",
    "httpx>=0.27",
    "pandas>=2.0",
    "psycopg[binary]>=3.2",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "urllib3>=2.0",
    "websockets>=14",
    "zstandard>=0.22",
]

[project.optional-dependencies]
live = [
    "py-builder-relayer-client==0.0.2",
    "py-builder-signing-sdk==0.0.2",
    "py-clob-client-v2==1.1.0",
]
performance = ["orjson>=3.10"]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
paper-api = "scripts.paper_api_server:main"
paper-worker = "quant.paper.live_shadow_service:main"
paper-db = "quant.paper.db_migration:main"
paper-health = "quant.paper.production_runtime:main"
paper-account-truth = "quant.simulator.account_truth.cli:main"
paper-rewards = "quant.simulator.rewards.official_sync_cli:main"
paper-operations = "quant.simulator.operations.operations_cli:main"
paper-resolution = "quant.settlement.resolution_cli:main"
paper-bridge = "quant.simulator.economics.bridge_cli:main"
paper-clean-v2 = "quant.calibration.clean_v2_cohort_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant*", "scripts*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["quant", "scripts"]
